name: CI

# Lint and test on every push and pull request. Deliberately separate from deploy.yml: a red check here is a
# signal, not a gate on shipping during a hackathon window. Nothing in this workflow touches Azure or Foundry.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # the same pinned set the image installs, so CI type-checks what ships
      - run: pip install -r requirements.lock pytest pytest-asyncio ruff==0.17.2 pyright==1.1.414
      - name: Lint (ruff)
        run: python -m ruff check matchmind tests ../infra
      - name: Types (pyright, basic)
        run: python -m pyright
      - name: Tests (pytest, no network)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Types and build
        run: npm run build
      - name: Tests (vitest)
        run: npm test
