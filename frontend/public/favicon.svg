<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MatchMind">
  <!-- The centre of a pitch seen from above: halfway line and centre circle. One idea, two colours, and the
       amber tile keeps it legible at 16 px against both a dark and a light browser bar (the dark-on-dark
       variants vanished there). Colours are the app's own tokens: amber #ffd166 on ink #0b0f1a. -->
  <rect width="64" height="64" rx="12" fill="#ffd166"/>
  <path d="M32 4V60" stroke="#0b0f1a" stroke-width="7"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#0b0f1a" stroke-width="7"/>
</svg>
